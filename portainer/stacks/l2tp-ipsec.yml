services:
  vpn:
    container_name: ${VPN_CONTAINER_NAME}
    build:
      context: ../../l2tp-ipsec
    image: ${VPN_IMAGE:-local/l2tp-ipsec-forwarder:1.2}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ppp:/dev/ppp
    environment:
      VPN_SERVER: ${VPN_SERVER}
      VPN_USERNAME_FILE: /run/secrets/vpn_username
      VPN_PASSWORD_FILE: /run/secrets/vpn_password
      VPN_PSK_FILE: /run/secrets/vpn_psk
      VPN_DNS_SERVERS: ${VPN_DNS_SERVERS:-}
      VPN_DNS_SUFFIX: ${VPN_DNS_SUFFIX:-}
      VPN_IKE: ${VPN_IKE:-}
      VPN_ESP: ${VPN_ESP:-}
      PORT_FORWARDS: ${PORT_FORWARDS}
      HEALTH_TARGETS: ${HEALTH_TARGETS:-}
      HEALTH_MODE: ${HEALTH_MODE:-all}
    volumes:
      - ${SECRET_DIR}/username:/run/secrets/vpn_username:ro
      - ${SECRET_DIR}/password:/run/secrets/vpn_password:ro
      - ${SECRET_DIR}/psk:/run/secrets/vpn_psk:ro
    networks:
      - transit
networks:
  transit:
    name: ${TRANSIT_NETWORK:-guac-vpn-transit}
    external: true
