services:
  vpn:
    container_name: ${VPN_CONTAINER_NAME}
    build:
      context: ../../fortigate-ssl-vpn
    image: ${VPN_IMAGE:-local/fortivpn-forwarder:1.1}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
    environment:
      FORTI_HOST: ${FORTI_HOST}
      FORTI_PORT: ${FORTI_PORT:-443}
      FORTI_USERNAME_FILE: /run/secrets/vpn_username
      FORTI_PASSWORD_FILE: /run/secrets/vpn_password
      FORTI_REALM: ${FORTI_REALM:-}
      VPN_DNS_SERVERS: ${VPN_DNS_SERVERS:-}
      VPN_DNS_SUFFIX: ${VPN_DNS_SUFFIX:-}
      PORT_FORWARDS: ${PORT_FORWARDS}
      HEALTH_TARGETS: ${HEALTH_TARGETS:-}
      HEALTH_MODE: ${HEALTH_MODE:-all}
    volumes:
      - ${SECRET_DIR}/username:/run/secrets/vpn_username:ro
      - ${SECRET_DIR}/password:/run/secrets/vpn_password:ro
    networks:
      - transit
networks:
  transit:
    name: ${TRANSIT_NETWORK:-guac-vpn-transit}
    external: true
